# Supabase local de Dayflow. No modifica ni enlaza proyectos alojados.
project_id = "dayflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/", "http://127.0.0.1:5173/auth/update-password", "http://localhost:5173/", "http://localhost:5173/auth/update-password", "http://127.0.0.1:4178/", "http://127.0.0.1:4178/auth/update-password", "http://127.0.0.1:4181/", "http://127.0.0.1:4181/auth/update-password", "dayflow://auth/callback", "dayflow://auth/callback?next=recovery"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
email_sent = 100

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[functions.push-dispatch]
verify_jwt = false
